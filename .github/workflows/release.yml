name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2

    strategy:
      matrix:
        include:
          - variant: v1
            sdkconfig_extra: ""
            suffix: "base"
          - variant: v1.2
            sdkconfig_extra: "CONFIG_MIMI_HAS_DISPLAY=y"
            suffix: "display"
          - variant: v1.3
            sdkconfig_extra: "CONFIG_MIMI_HAS_DISPLAY=y\nCONFIG_MIMI_HAS_SERVOS=y"
            suffix: "full"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware (${{ matrix.variant }})
        shell: bash
        env:
          SDKCONFIG_EXTRA: ${{ matrix.sdkconfig_extra }}
        run: |
          . $IDF_PATH/export.sh

          # ATTENTION A L'ORDRE.
          # `idf.py set-target` genere sdkconfig a partir de sdkconfig.defaults*
          # et NE LE REGENERE PLUS ensuite. Ajouter les options APRES set-target
          # (comme on le faisait) n'avait donc aucun effet : les variantes
          # display et full etaient en realite des builds base, sans ecran ni
          # servos. On ecrit les options AVANT, dans le fichier specifique au
          # target (lu en dernier, donc prioritaire).
          if [ -n "$SDKCONFIG_EXTRA" ]; then
            printf '%b\n' "$SDKCONFIG_EXTRA" >> sdkconfig.defaults.esp32s3
          fi

          rm -f sdkconfig
          idf.py set-target esp32s3
          idf.py build

      - name: Verifier que la variante est bien celle attendue
        shell: bash
        env:
          SDKCONFIG_EXTRA: ${{ matrix.sdkconfig_extra }}
        run: |
          # Sans ce garde-fou, une regression de l'ordre ci-dessus republie
          # silencieusement trois fois le meme firmware.
          fail=0

          expect_sym() {   # $1 = symbole, $2 = doit-etre-present (0/1)
            if grep -q "$1" build/*.map; then found=1; else found=0; fi
            if [ "$found" != "$2" ]; then
              echo "ERREUR: symbole '$1' present=$found, attendu=$2"
              fail=1
            fi
          }

          case "$SDKCONFIG_EXTRA" in
            *MIMI_HAS_SERVOS*)
              grep -q '^CONFIG_MIMI_HAS_DISPLAY=y' sdkconfig || { echo "ERREUR: DISPLAY absent de sdkconfig"; fail=1; }
              grep -q '^CONFIG_MIMI_HAS_SERVOS=y'  sdkconfig || { echo "ERREUR: SERVOS absent de sdkconfig";  fail=1; }
              expect_sym display_ui_init 1
              expect_sym body_animator_init 1
              ;;
            *MIMI_HAS_DISPLAY*)
              grep -q '^CONFIG_MIMI_HAS_DISPLAY=y' sdkconfig || { echo "ERREUR: DISPLAY absent de sdkconfig"; fail=1; }
              expect_sym display_ui_init 1
              expect_sym body_animator_init 0
              ;;
            *)
              expect_sym display_ui_init 0
              expect_sym body_animator_init 0
              ;;
          esac

          [ "$fail" = "0" ] && echo "OK: variante conforme"
          exit $fail

      - name: Prepare release artifacts
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          VERSION="${GITHUB_REF_NAME}"
          SUFFIX="${{ matrix.suffix }}"

          # Generate merged firmware for single-command flashing
          esptool.py --chip esp32s3 merge_bin \
            --flash_mode qio \
            --flash_size 16MB \
            --flash_freq 80m \
            -o "mimiclaw-${SUFFIX}-${VERSION}.bin" \
            0x0     build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0xf000  build/ota_data_initial.bin \
            0x20000 build/mimiclaw.bin

          # Copy app binary with variant suffix
          cp build/mimiclaw.bin "mimiclaw-${SUFFIX}-app-${VERSION}.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.suffix }}
          path: mimiclaw-*.bin

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Firmware Variants

            | Variante | Description | Fichier |
            |---|---|---|
            | **v1.0 (base)** | ESP32-S3 sans ecran | `mimiclaw-base-*.bin` |
            | **v1.2 (display)** | + Ecran T-Display S3 | `mimiclaw-display-*.bin` |
            | **v1.3 (full)** | + HC-SR04 + 4 servos | `mimiclaw-full-*.bin` |

            ## Flashing Guide

            Download the merged firmware for your variant and flash:

            ```bash
            esptool.py --chip esp32s3 -b 460800 write_flash 0x0 mimiclaw-<variant>-${{ github.ref_name }}.bin
            ```

            ### OTA update

            Upload `mimiclaw-<variant>-app-${{ github.ref_name }}.bin` via the OTA endpoint.

            ### First-time setup

            After flashing, connect to WiFi **LilyClaw-Setup** (pass: lilyclaw1) and open http://192.168.4.1 to configure.
          files: |
            mimiclaw-*.bin
