name: CI Build

# Le workflow release.yml ne se declenche que sur un tag v*.
# Resultat : la seule facon de savoir si le firmware compile etait de publier
# une release. Ce workflow valide les 3 variantes a chaque push et chaque PR,
# pour qu'un tag ne soit plus jamais un pari.

on:
  push:
    branches: ['**']
    paths:
      - 'main/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults*'
      - 'partitions.csv'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v1
            sdkconfig_extra: ""
            suffix: "base"
          - variant: v1.2
            sdkconfig_extra: "CONFIG_MIMI_HAS_DISPLAY=y"
            suffix: "display"
          - variant: v1.3
            sdkconfig_extra: "CONFIG_MIMI_HAS_DISPLAY=y\nCONFIG_MIMI_HAS_SERVOS=y"
            suffix: "full"

    name: build ${{ matrix.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware (${{ matrix.variant }})
        shell: bash
        env:
          SDKCONFIG_EXTRA: ${{ matrix.sdkconfig_extra }}
        run: |
          . $IDF_PATH/export.sh

          # ATTENTION A L'ORDRE.
          # `idf.py set-target` genere sdkconfig a partir de sdkconfig.defaults*
          # et NE LE REGENERE PLUS ensuite. Ajouter les options APRES set-target
          # (comme on le faisait) n'avait donc aucun effet : les variantes
          # display et full etaient en realite des builds base, sans ecran ni
          # servos. On ecrit les options AVANT, dans le fichier specifique au
          # target (lu en dernier, donc prioritaire).
          if [ -n "$SDKCONFIG_EXTRA" ]; then
            printf '%b\n' "$SDKCONFIG_EXTRA" >> sdkconfig.defaults.esp32s3
          fi

          rm -f sdkconfig
          idf.py set-target esp32s3
          idf.py build

      - name: Binaire de test flashable
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          SUFFIX="${{ matrix.suffix }}"
          SHORT="${GITHUB_SHA::8}"

          # Image fusionnee : un seul fichier a flasher a l'offset 0, comme
          # pour une release, mais SANS publier quoi que ce soit. Sert a
          # tester une branche sur du vrai materiel avant de tagger.
          esptool.py --chip esp32s3 merge_bin \
            --flash_mode qio --flash_size 16MB --flash_freq 80m \
            -o "lilyclaw-${SUFFIX}-${SHORT}.bin" \
            0x0     build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0xf000  build/ota_data_initial.bin \
            0x20000 build/mimiclaw.bin

          # Pas de python multi-ligne ici : les lignes commenceraient en
          # colonne 0 et termineraient le bloc "run: |" -> YAML invalide,
          # workflow non parse, zero job execute et un echec sans logs.
          APP=$(stat -c%s build/mimiclaw.bin)
          PCT=$(( APP * 1000 / (2 * 1024 * 1024) ))
          echo "--- taille ---"
          ls -l build/mimiclaw.bin "lilyclaw-${SUFFIX}-${SHORT}.bin"
          echo "app: $(( APP / 1024 )) Ko  ($(( PCT / 10 )).$(( PCT % 10 )) % de la partition ota_0 de 2 Mo)"

      - name: Publier le binaire de test
        uses: actions/upload-artifact@v4
        with:
          name: lilyclaw-${{ matrix.suffix }}-${{ github.sha }}
          path: lilyclaw-*.bin
          retention-days: 14

      - name: Verifier que la variante est bien celle attendue
        shell: bash
        env:
          SDKCONFIG_EXTRA: ${{ matrix.sdkconfig_extra }}
        run: |
          # Sans ce garde-fou, une regression de l'ordre ci-dessus republie
          # silencieusement trois fois le meme firmware.
          fail=0

          expect_sym() {   # $1 = symbole, $2 = doit-etre-present (0/1)
            if grep -q "$1" build/*.map; then found=1; else found=0; fi
            if [ "$found" != "$2" ]; then
              echo "ERREUR: symbole '$1' present=$found, attendu=$2"
              fail=1
            fi
          }

          case "$SDKCONFIG_EXTRA" in
            *MIMI_HAS_SERVOS*)
              grep -q '^CONFIG_MIMI_HAS_DISPLAY=y' sdkconfig || { echo "ERREUR: DISPLAY absent de sdkconfig"; fail=1; }
              grep -q '^CONFIG_MIMI_HAS_SERVOS=y'  sdkconfig || { echo "ERREUR: SERVOS absent de sdkconfig";  fail=1; }
              expect_sym display_ui_init 1
              expect_sym body_animator_init 1
              ;;
            *MIMI_HAS_DISPLAY*)
              grep -q '^CONFIG_MIMI_HAS_DISPLAY=y' sdkconfig || { echo "ERREUR: DISPLAY absent de sdkconfig"; fail=1; }
              expect_sym display_ui_init 1
              expect_sym body_animator_init 0
              ;;
            *)
              expect_sym display_ui_init 0
              expect_sym body_animator_init 0
              ;;
          esac

          [ "$fail" = "0" ] && echo "OK: variante conforme"
          exit $fail

      - name: Report binary size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size | tail -20

  # Les helpers de main/util/ sont du C portable pur : ils se testent sur
  # l'hote, sans materiel, sous sanitizers.
  unit-tests:
    runs-on: ubuntu-latest
    name: tests helpers (ASan/UBSan)
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run host tests
        run: |
          set -e
          cd test/host
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer"

          # Helpers de chaines et framing HTTP
          gcc -O1 -Wall -Wextra -std=gnu11 -I../../main/util $SAN \
              -o test_safe_str test_safe_str.c
          ./test_safe_str

          # Etat interieur + budget d'initiative.
          # TZ fixe : le rythme circadien et les heures creuses en dependent.
          gcc -O1 -Wall -Wextra -std=gnu11 -I../../main $SAN \
              -o test_soul test_soul.c \
              ../../main/soul/drives.c ../../main/soul/salience.c -lm
          TZ=Europe/Luxembourg ./test_soul
